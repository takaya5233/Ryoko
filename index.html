<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikmin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #fff9c4 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-main: #4e342e;
            --text-sub: #795548;
            --ok: #28cd41;
            --warn: #ff9500;
            --ng: #ff3b30;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #333;
            display: flex; justify-content: center;
            color: var(--text-main);
        }

        .phone-canvas {
            width: 100%; max-width: 430px; min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; flex-direction: column; gap: 8px;
            padding: 10px 8px 40px;
            box-sizing: border-box;
        }

        /* ── 時計 ── */
        #datetime-section { text-align: center; margin: 5px 0; }
        #date { font-size: 0.95rem; font-weight: 700; color: var(--text-sub); }
        #time { font-size: 3rem; font-weight: 900; margin: -5px 0; letter-spacing: 2px; }

        /* ── 名言 ── */
        #quote-section {
            text-align: center; padding: 0 12px 4px;
            font-size: 0.68rem; color: var(--text-sub); line-height: 1.5;
        }
        #quote-section .q-text { font-weight: 700; }
        #quote-section .q-author { font-size: 0.58rem; color: #a1887f; margin-top: 2px; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); border: 2px solid var(--glass-border);
            border-radius: 20px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .section-title { font-size: 0.7rem; font-weight: 900; color: var(--text-sub); margin-bottom: 6px; display: block; }

        /* ── 今日のあんしん予報 ── */
        .weather-summary-line {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
            padding-bottom: 6px; border-bottom: 1px dashed rgba(0,0,0,0.05);
        }
        #current-icon { font-size: 1.4rem; }
        #max-min-temp { font-size: 1rem; font-weight: 900; white-space: nowrap; }
        #max-min-temp .mx { color: var(--ng); }
        #max-min-temp .mn { color: #03a9f4; }
        #wind-display { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); }
        #rain-comment { font-size: 0.7rem; font-weight: 900; color: #03a9f4; margin-left: auto; }

        .current-main { 
            display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap;
        }

        .badges { 
            display: flex; flex-direction: column; gap: 4px; 
            align-items: flex-start; flex: 0 0 auto; justify-content: center; 
        }
        .badge {
            font-size: 0.7rem; font-weight: 900; padding: 4px 10px; border-radius: 8px;
            background: rgba(255,255,255,1); display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid rgba(0,0,0,0.05);
            min-width: 100px;
            box-sizing: border-box;
        }

        /* ── サッカー次節ボックス ── */
        .match-box {
            flex: 1 1 180px; 
            min-width: 0; 
            background: rgba(255,255,255,0.9); border-radius: 12px;
            padding: 6px; border: 1px solid rgba(0,0,0,0.06);
            text-align: center; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center;
        }
        .nm-header { font-size: 0.55rem; font-weight: 900; color: #43a047; }
        .nm-date   { font-size: 0.65rem; font-weight: 900; color: var(--text-main); margin: 1px 0; }
        .nm-teams  { font-size: 0.55rem; font-weight: 700; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nm-vs     { font-size: 0.5rem; color: #bbb; margin: 0 2px; }
        .nm-venue  { font-size: 0.55rem; color: #a1887f; margin-top: 2px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nm-rank   { color: #43a047; font-weight: 900; }

        /* ── 日没までの空もよう ── */
        .hourly-section-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .hourly-section-header .section-title { margin-bottom: 0; }
        .sun-times-inline { font-size: 0.6rem; font-weight: 700; color: var(--text-sub); white-space: nowrap; }
        .hourly-scroll { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 5px; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hourly-item { display: flex; flex-direction: column; align-items: center; min-width: 34px; gap: 2px; }
        .h-time { font-size: 0.6rem; font-weight: 700; color: var(--text-sub); }
        .h-icon { font-size: 1.1rem; line-height: 1; }
        .h-prob { font-size: 0.6rem; color: #03a9f4; font-weight: 900; }
        .tomorrow-inline {
            display: flex; align-items: center; gap: 6px; margin-top: 6px;
            padding: 4px 8px; background: rgba(255,255,255,0.85);
            border-radius: 8px; font-size: 0.65rem; font-weight: 700;
            color: var(--text-sub); border: 1px solid rgba(0,0,0,0.05);
        }

        /* ── ピクミン ── */
        .p-container { display: flex; flex-direction: column; gap: 10px; }
        .p-card { background: white; border-radius: 18px; overflow: hidden; border: 2px solid var(--glass-border); }
        .p-label { padding: 6px; font-size: 0.7rem; font-weight: 900; text-align: center; background: #fff; border-bottom: 1px solid #eee; }
        .p-card img { width: 100%; height: auto; display: block; }
        .p-no-data { text-align: center; padding: 20px 10px; color: #aaa; font-size: 0.78rem; line-height: 1.8; }
        .p-no-data .hint {
            display: inline-block; margin-top: 6px; background: #f5f5f5;
            border-radius: 8px; padding: 4px 10px; font-size: 0.65rem; color: #bbb;
        }

        /* ── 週間予報 ── */
        .weekly-grid { display: flex; justify-content: space-between; }
        .w-item { flex: 1; text-align: center; font-size: 0.6rem; font-weight: 700; }
        .w-icon { font-size: 1rem; margin: 2px 0; display: block; }

        .dot { height: 7px; width: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .bg-ok   { background-color: var(--ok); }
        .bg-warn { background-color: var(--warn); }
        .bg-ng   { background-color: var(--ng); }
    </style>
</head>
<body>

<div class="phone-canvas">
    <header id="datetime-section">
        <div id="date">--月--日 (--)</div>
        <div id="time">00:00</div>
    </header>

    <div id="quote-section">
        <div class="q-text" id="q-text"></div>
        <div class="q-author" id="q-author"></div>
    </div>

    <section class="glass-card">
        <span class="section-title">🐾 今日のあんしん予報</span>
        <div class="weather-summary-line">
            <div id="current-icon">☀️</div>
            <div id="max-min-temp"><span class="mx">--</span> / <span class="mn">--</span></div>
            <div id="wind-display">💨 -- m/s</div>
            <div id="rain-comment"></div>
        </div>
        <div class="current-main">
            <div id="index-container" class="badges"></div>
            <div class="match-box" id="next-match"></div>
        </div>
    </section>

    <section class="glass-card">
        <div class="hourly-section-header">
            <span class="section-title">☁️ 日没までの空もよう</span>
            <div id="sun-times-inline" class="sun-times-inline"></div>
        </div>
        <div id="hourly-list" class="hourly-scroll"></div>
        <div id="tomorrow-box" class="tomorrow-inline">明日 -- -- / --</div>
    </section>

    <section class="glass-card">
        <span class="section-title" id="pikmin-title">🌿 ピクミンブルーム 最新情報</span>
        <div id="pikmin-content" class="p-container"></div>
    </section>

    <section class="glass-card">
        <span class="section-title">📅 週間予報</span>
        <div id="weekly-list" class="weekly-grid"></div>
    </section>
</div>

<script>
    const PIKMIN_MONTHLY = {
        "2026-04": {
            eventName: "4月のピクミン情報",
            cards: [
                { label: "今月のお題",  url: "https://lh3.googleusercontent.com/aOe_CqCJdFevS2otcFy913LHXkdbCpGQ4idw-DZqD6qYClbXBxMydcbSm5NhADdjoUnRu9Hg0hsm3RUgprGpSm6mss9BlI6_16k=e365-pa-nu-w1700" },
                { label: "ボーナス報酬", url: "https://lh3.googleusercontent.com/jaz1ERppQaebuacrS6xyumT_WFuO2fpw20XqgzAlMyxMj5mB6nerpzA3C7nh2xKtZTRGztpar05amhvcMod2RzRVKUUoYGy1UQ=e365-pa-nu-w1700" }
            ]
        },
        "2026-05": {
            eventName: "5月のイベント名",
            cards: [
                { label: "今月のお題",  url: "" },
                { label: "ボーナス報酬", url: "https://lh3.googleusercontent.com/hJnceMAaxtWGJnBtrntbLOvSCRmSj3-iIPfu3VRRxq-e1Z9vD7rA8E-xuoQTL6xVQNtrV0g8IpaSrUGjMKf6ewc-6M6pBVUPbIg=e365-pa-nu-w850" }
            ]
        },
    };

    const JOETSU = {
        name: "上越",
        rank: 8,
        schedule: [
            { round: 5,  date: "2026-05-03", label: "5/3(土)",  time: "14:00", opponent: "松本国際",    oppRank: 1,  venue: "松本市サッカー場" },
            { round: 6,  date: "2026-05-10", label: "5/10(土)", time: "10:30", opponent: "富山第一",    oppRank: 6,  venue: "新井総合公園陸上競技場" },
            { round: 7,  date: "2026-05-16", label: "5/16(土)", time: "11:00", opponent: "帝京長岡2nd", oppRank: 9,  venue: "帝京長岡" },
            { round: 8,  date: "2026-05-23", label: "5/23(土)", time: "10:30", opponent: "富山U18",      oppRank: 10, venue: "新井総合公園陸上競技場" },
            { round: 9,  date: "2026-06-13", label: "6/13(土)", time: "10:30", opponent: "星稜",          oppRank: 4,  venue: "新井総合公園陸上競技場" },
            { round: 10, date: "2026-06-27", label: "6/27(土)", time: "10:30", opponent: "新潟U18",      oppRank: 3,  venue: "新井総合公園陸上競技場" },
            { round: 11, date: "2026-07-04", label: "7/4(土)",  time: "09:30", opponent: "松本U18",      oppRank: 4,  venue: "新井総合公園陸上競技場" },
            { round: 12, date: "2026-07-11", label: "7/11(土)", time: "09:30", opponent: "日本文理",    oppRank: 2,  venue: "日本文理" },
            { round: 13, date: "2026-09-05", label: "9/5(土)",  time: "09:30", opponent: "鵬学園",        oppRank: 7,  venue: "刈羽ぴあパークサッカー場A" },
            { round: 14, date: "2026-09-12", label: "9/12(土)", time: "09:30", opponent: "松本国際",    oppRank: 1,  venue: "刈羽ぴあパークサッカー場A" },
            { round: 15, date: "2026-09-26", label: "9/26(土)", time: "10:30", opponent: "富山第一",    oppRank: 6,  venue: "富山第一" },
            { round: 16, date: "2026-10-03", label: "10/3(土)", time: "10:30", opponent: "帝京長岡2nd", oppRank: 9,  venue: "新井総合公園陸上競技場" },
            { round: 17, date: "2026-11-14", label: "11/14(土)",time: "10:30", opponent: "富山U18",      oppRank: 10, venue: "岩瀬スポーツ公園" },
            { round: 18, date: "2026-11-21", label: "11/21(土)",time: "10:30", opponent: "星稜",          oppRank: 4,  venue: "星稜" },
        ]
    };

    function renderNextMatch() {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const match = JOETSU.schedule.find(m => new Date(m.date) >= today);
        const el = document.getElementById('next-match');
        if (!match) {
            el.innerHTML = `<div style="font-size:0.6rem;color:#aaa;text-align:center">試合終了<br>お疲れさまでした⚽</div>`;
            return;
        }
        const timeStr = match.time ? `${match.time}〜` : '';
        el.innerHTML = `
            <div class="nm-header">⚽ 次節 第${match.round}節</div>
            <div class="nm-date">${match.label}${timeStr}</div>
            <div class="nm-teams">${JOETSU.name}<span class="nm-rank">(${JOETSU.rank}位)</span><span class="nm-vs">vs</span>${match.opponent}<span class="nm-rank">(${match.oppRank}位)</span></div>
            <div class="nm-venue">📍 ${match.venue}</div>
        `;
    }

    function renderPikmin() {
        const now = new Date();
        const key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const d = PIKMIN_MONTHLY[key];
        const content = document.getElementById('pikmin-content');
        const title   = document.getElementById('pikmin-title');
        if (!d) {
            content.innerHTML = `<div class="p-no-data">📋 ${now.getMonth() + 1}月のデータは未登録です<br><span class="hint">PIKMIN_MONTHLY に追加してください</span></div>`;
            return;
        }
        title.textContent = `🌿 ${d.eventName}`;
        content.innerHTML = d.cards.map(c => `
            <div class="p-card">
                <div class="p-label">${c.label}</div>
                <img src="${c.url}" alt="${c.label}" onerror="this.style.display='none'">
            </div>`).join('');
    }

    const QUOTES = [
        { text: "知識には限りがあるが、想像力は世界を包む。", author: "アルベルト・アインシュタイン" },
        { text: "教育とは、学校で習ったことを忘れた後に残るものだ。", author: "アルベルト・アインシュタイン" },
        { text: "人生は近くで見ると悲劇だが、遠くから見ると喜劇だ。", author: "チャールズ・チャップリン" },
        { text: "自分を愛することは、一生続く恋愛の始まりだ。", author: "オスカー・ワイルド" },
        { text: "幸福とは、何かを持つことではなく、何かである状態のことをいう。", author: "アリストテレス" },
        { text: "私が知っていることは、私が何も知らないということだ。", author: "ソクラテス" },
        { text: "最も強い者ではなく、最も変化に適応できる者が生き残る。", author: "チャールズ・ダーウィン" },
        { text: "今日という日は、残りの人生の最初の一日だ。", author: "" },
    ];

    function renderQuote() {
        const orderKey = 'pik_qorder', idxKey = 'pik_qidx';
        let order = JSON.parse(localStorage.getItem(orderKey) || 'null');
        let idx   = parseInt(localStorage.getItem(idxKey) || '0');
        if (!order || idx >= order.length) {
            order = Array.from({ length: QUOTES.length }, (_, i) => i).sort(() => Math.random() - 0.5);
            idx = 0;
            localStorage.setItem(orderKey, JSON.stringify(order));
        }
        const q = QUOTES[order[idx]];
        localStorage.setItem(idxKey, String(idx + 1));
        document.getElementById('q-text').textContent   = `「${q.text}」`;
        document.getElementById('q-author').textContent = q.author ? `― ${q.author}` : '';
    }

    function updateClock() {
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        document.getElementById('date').innerText =
            (now.getMonth() + 1) + '月' + now.getDate() + '日 (' + days[now.getDay()] + ')';
        document.getElementById('time').innerText =
            now.getHours().toString().padStart(2, '0') + ':' +
            now.getMinutes().toString().padStart(2, '0');
    }

    const weatherIcons = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",61:"🌧️",63:"🌧️",65:"🌧️",80:"🌦️",81:"🌧️",82:"🌧️",95:"⚡"};

    function getFashion(temp) {
        if (temp < 5)  return "ダウン";
        if (temp < 10) return "冬コート";
        if (temp < 15) return "厚手ニット";
        if (temp < 20) return "長袖/薄手";
        if (temp < 25) return "半袖+羽織";
        return "半袖";
    }

    function getIndexSymbol(score) {
        if (score >= 3) return { s: "◎", c: "bg-ok", color: "var(--ok)" };
        if (score >= 2) return { s: "○", c: "bg-ok", color: "var(--ok)" };
        if (score >= 1) return { s: "△", c: "bg-warn", color: "var(--warn)" };
        return { s: "✕", c: "bg-ng", color: "var(--ng)" };
    }

    async function fetchWeather(pos) {
        const res = await fetch(
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}` +
            `&current_weather=true` +
            `&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,windspeed_10m` +
            `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset` +
            `&timezone=Asia%2FTokyo&models=best_match`
        );
        const data = await res.json();
        renderData(data);
    }

    function renderData(data) {
        const now      = new Date();
        const hr       = now.getHours();
        const todayStr = now.toLocaleDateString('sv');

        // --- 今日の判定 ---
        let walkScore = 3;
        const curIdx = data.hourly.time.findIndex(t => t === `${todayStr}T${String(hr).padStart(2,'0')}:00`);
        if (curIdx >= 0) {
            const prob = data.hourly.precipitation_probability[curIdx];
            const prec = data.hourly.precipitation[curIdx];
            if (prec > 0 || prob > 70) walkScore = 0;
            else if (prec > 0 || prob > 40) walkScore = 1;
            else if (prob > 15) walkScore = 2;
        }
        const walkIdx = getIndexSymbol(walkScore);

        const idx7  = data.hourly.time.findIndex(t => t === `${todayStr}T07:00`);
        const idx16 = data.hourly.time.findIndex(t => t === `${todayStr}T16:00`);
        const p7    = idx7  >= 0 ? data.hourly.precipitation[idx7]  : 0;
        const p16   = idx16 >= 0 ? data.hourly.precipitation[idx16] : 0;
        const prob7 = idx7  >= 0 ? data.hourly.precipitation_probability[idx7] : 0;
        const prob16= idx16 >= 0 ? data.hourly.precipitation_probability[idx16] : 0;
        let bikeScore = 3;
        if (p7 > 0 || p16 > 0 || prob7 > 50 || prob16 > 50) bikeScore = 0;
        else if (prob7 > 20 || prob16 > 20) bikeScore = 1;
        const bikeIdx = getIndexSymbol(bikeScore);

        let rainComment = "雨の心配なし";
        const futureHourly = data.hourly.time.map((t, i) => ({ time: t, prob: data.hourly.precipitation_probability[i] }));
        const rainHour = futureHourly.find(h => h.time.includes(todayStr) && parseInt(h.time.split('T')[1]) >= hr && h.prob >= 40);
        if (rainHour) {
            const rh = parseInt(rainHour.time.split('T')[1]);
            rainComment = (rh === hr) ? "まもなく雨" : `${rh}時頃に雨`;
        }

        document.getElementById('current-icon').innerText = weatherIcons[data.current_weather.weathercode] || "☀️";
        const windMs = (data.current_weather.windspeed / 3.6).toFixed(1);
        document.getElementById('max-min-temp').innerHTML =
            `<span class="mx">${Math.round(data.daily.temperature_2m_max[0])}</span> ` +
            `/ <span class="mn">${Math.round(data.daily.temperature_2m_min[0])}</span>`;
        document.getElementById('wind-display').innerText = `💨 ${windMs} m/s`;
        document.getElementById('rain-comment').innerText = rainComment;

        // 今日のバッジ（洗濯を削除）
        document.getElementById('index-container').innerHTML = `
            <div class="badge"><span class="dot ${walkIdx.c}"></span>散歩：${walkIdx.s}</div>
            <div class="badge"><span class="dot ${bikeIdx.c}"></span>自転車：${bikeIdx.s}</div>
            <div class="badge"><span class="dot" style="background:#03a9f4"></span>服装：${getFashion(data.current_weather.temperature)}</div>
        `;

        const sunsetH = parseInt(data.daily.sunset[0].split('T')[1]);
        const hBox = document.getElementById('hourly-list');
        hBox.innerHTML = '';
        data.hourly.time.forEach((t, i) => {
            if (!t.includes(todayStr)) return;
            const h = parseInt(t.split('T')[1]);
            if (h < hr || h > sunsetH) return;
            hBox.innerHTML += `
                <div class="hourly-item">
                    <div class="h-time">${h === hr ? '今' : h + '時'}</div>
                    <div class="h-icon">${weatherIcons[data.hourly.weather_code[i]] || "☀️"}</div>
                    <div class="h-prob">${data.hourly.precipitation_probability[i]}%</div>
                </div>`;
        });

        // --- 明日の予報と判定 ---
        const tmrDate = new Date(now); tmrDate.setDate(tmrDate.getDate() + 1);
        const tmrStr  = tmrDate.toLocaleDateString('sv');
        const tmrIcon = weatherIcons[data.daily.weather_code[1]] || "☀️";
        const tmrMax  = Math.round(data.daily.temperature_2m_max[1]);
        const tmrMin  = Math.round(data.daily.temperature_2m_min[1]);

        // 明日の自転車判定
        const tmrIdx7  = data.hourly.time.findIndex(t => t === `${tmrStr}T07:00`);
        const tmrIdx16 = data.hourly.time.findIndex(t => t === `${tmrStr}T16:00`);
        const tmrP7    = tmrIdx7  >= 0 ? data.hourly.precipitation[tmrIdx7]  : 0;
        const tmrP16   = tmrIdx16 >= 0 ? data.hourly.precipitation[tmrIdx16] : 0;
        const tmrProb7 = tmrIdx7  >= 0 ? data.hourly.precipitation_probability[tmrIdx7] : 0;
        const tmrProb16= tmrIdx16 >= 0 ? data.hourly.precipitation_probability[tmrIdx16] : 0;
        
        let tmrBikeScore = 3;
        if (tmrP7 > 0 || tmrP16 > 0 || tmrProb7 > 50 || tmrProb16 > 50) tmrBikeScore = 0;
        else if (tmrProb7 > 20 || tmrProb16 > 20) tmrBikeScore = 1;
        const tmrBikeIdx = getIndexSymbol(tmrBikeScore);

        // 明日の洗濯判定
        const tmrDayProbs = [];
        for (let h = 9; h <= 18; h++) {
            const i = data.hourly.time.findIndex(t => t === `${tmrStr}T${String(h).padStart(2,'0')}:00`);
            if (i >= 0) tmrDayProbs.push(data.hourly.precipitation_probability[i]);
        }
        const tmrMaxProb = tmrDayProbs.length > 0 ? Math.max(...tmrDayProbs) : 0;
        const tmrWCode   = data.daily.weather_code[1];
        const tmrW7    = tmrIdx7  >= 0 ? data.hourly.windspeed_10m[tmrIdx7]  : 0;
        const tmrW16   = tmrIdx16 >= 0 ? data.hourly.windspeed_10m[tmrIdx16] : 0;
        const tmrWindAvg = (tmrW7 + tmrW16) / 2 / 3.6;
        const tmrWindMs = tmrWindAvg.toFixed(1);

        let tmrLaundryScore;
        if (tmrMaxProb >= 70 || tmrWCode >= 61)                 tmrLaundryScore = 0;
        else if (tmrMaxProb >= 40 || tmrWCode >= 51)            tmrLaundryScore = 1;
        else if (tmrWCode <= 1 && tmrWindAvg >= 3 && tmrMaxProb < 20) tmrLaundryScore = 3;
        else if (tmrWCode <= 3 && tmrMaxProb < 30)                    tmrLaundryScore = 2;
        else                                                    tmrLaundryScore = 1;
        const tmrLaundryIdx = getIndexSymbol(tmrLaundryScore);

        document.getElementById('tomorrow-box').innerHTML =
            `明日 ${tmrIcon} <span style="color:var(--ng);font-weight:900">${tmrMax}</span> ` +
            `/ <span style="color:#03a9f4;font-weight:900">${tmrMin}</span> ` +
            ` 💨${tmrWindMs}m/s ` +
            ` <span style="color:${tmrBikeIdx.color};font-weight:900">自転車：${tmrBikeIdx.s}</span> ` +
            ` <span style="color:${tmrLaundryIdx.color};font-weight:900">洗濯：${tmrLaundryIdx.s}</span>`;

        const sunrise = data.daily.sunrise[0].split('T')[1];
        const sunset  = data.daily.sunset[0].split('T')[1];
        document.getElementById('sun-times-inline').innerText = `🌅${sunrise} 🌇${sunset}`;

        const wBox = document.getElementById('weekly-list');
        wBox.innerHTML = '';
        const days = ['日','月','火','水','木','金','土'];
        for (let i = 0; i < 7; i++) {
            const d = new Date(data.daily.time[i]);
            wBox.innerHTML += `
                <div class="w-item">
                    <div>${i === 0 ? '今日' : days[d.getDay()]}</div>
                    <span class="w-icon">${weatherIcons[data.daily.weather_code[i]] || "☀️"}</span>
                    <div style="color:var(--ng)">${Math.round(data.daily.temperature_2m_max[i])}</div>
                    <div style="color:#03a9f4">${Math.round(data.daily.temperature_2m_min[i])}</div>
                </div>`;
        }
    }

    updateClock();
    setInterval(updateClock, 60000);
    renderPikmin();
    renderQuote();
    renderNextMatch();
    navigator.geolocation.getCurrentPosition(fetchWeather);
</script>
</body>
</html>

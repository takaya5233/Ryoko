<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikmin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #fff9c4 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-main: #4e342e;
            --text-sub: #795548;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #333;
            display: flex; justify-content: center;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .phone-canvas {
            width: 100%; max-width: 430px; min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; flex-direction: column; gap: 10px;
            padding: 10px 10px 60px;
            box-sizing: border-box;
        }

        #datetime-section { text-align: center; margin: 5px 0; }
        #date { font-size: 0.95rem; font-weight: 700; color: var(--text-sub); white-space: nowrap; }
        #time { font-size: 3.5rem; font-weight: 900; margin: -5px 0; letter-spacing: 1px; }

        #quote-section {
            text-align: center; padding: 5px 8px 15px;
            min-height: 4.2em; display: flex; flex-direction: column; justify-content: center;
        }
        .q-text { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); line-height: 1.5; padding: 0 8px; }
        .q-author { font-size: 0.65rem; color: #a1887f; margin-top: 4px; font-weight: 700; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 2px solid var(--glass-border);
            border-radius: 20px; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .section-title { font-size: 0.8rem; font-weight: 900; color: var(--text-sub); margin: 0; display: flex; align-items: center; height: 1.5rem; white-space: nowrap; }

        .hourly-section-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; height: 1.5rem;
        }
        .sun-times-container { display: flex; align-items: center; gap: 8px; height: 100%; }
        .sun-times-inline { font-size: 0.65rem; font-weight: 700; color: var(--text-sub); line-height: 1.5rem; white-space: nowrap; }
        .weather-location {
            font-size: 0.6rem;
            color: #8d6e63;
            font-weight: 900;
            text-align: right;
            margin: -4px 0 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .hourly-scroll { display: flex; overflow-x: auto; gap: 14px; padding: 2px 0 8px; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hourly-item { 
            display: flex; flex-direction: column; align-items: center; 
            min-width: 46px; gap: 4px; 
        }
        .h-time { font-size: 0.7rem; font-weight: 700; color: var(--text-sub); height: 0.9rem; line-height: 0.9rem; }
        .h-icon { font-size: 1.4rem; height: 1.6rem; display: flex; align-items: center; justify-content: center; margin: 2px 0; }
        .h-prob { font-size: 0.65rem; color: #03a9f4; font-weight: 900; margin-bottom: 0; height: 0.8rem; line-height: 0.8rem; }
        .h-temp { font-size: 0.65rem; color: #f44336; font-weight: 900; height: 0.8rem; line-height: 0.8rem; }
        .h-wind { font-size: 0.6rem; color: #607d8b; font-weight: 900; height: 0.8rem; line-height: 0.8rem; white-space: nowrap; }

        .tomorrow-row {
            margin-top: 8px; padding: 8px 10px; background: rgba(255,255,255,0.85);
            border-radius: 12px; border: 1px solid rgba(0,0,0,0.03);
            font-size: 0.75rem; font-weight: 900; color: var(--text-sub);
            display: flex; align-items: center; justify-content: space-between;
            gap: 6px; white-space: nowrap;
        }

        .p-container { display: flex; flex-direction: column; gap: 8px; }
        .p-card { background: white; border-radius: 15px; overflow: hidden; border: 2px solid var(--glass-border); }
        .p-label { padding: 6px; font-size: 0.75rem; font-weight: 900; text-align: center; background: #fff; }
        .p-card img { width: 100%; height: auto; display: block; }

        .weekly-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 2px;
            align-items: start;
        }
        .w-item {
            min-width: 0;
            text-align: center;
            font-size: 0.62rem;
            font-weight: 700;
            display: grid;
            grid-template-rows: 0.9rem 1.6rem 0.85rem 0.85rem 0.85rem;
            align-items: center;
            justify-items: center;
        }
        .w-date {
            font-size: 0.56rem;
            color: var(--text-sub);
            height: 0.9rem;
            line-height: 0.9rem;
            white-space: nowrap;
        }
        .w-icon {
            font-size: 1.25rem;
            height: 1.6rem;
            line-height: 1.6rem;
            display: block;
            min-height: 1.6rem;
        }
        .w-max {
            color: red;
            height: 0.85rem;
            line-height: 0.85rem;
            white-space: nowrap;
        }
        .w-min {
            color: blue;
            height: 0.85rem;
            line-height: 0.85rem;
            white-space: nowrap;
        }
        .w-wind {
            color: #607d8b;
            font-size: 0.54rem;
            font-weight: 900;
            height: 0.85rem;
            line-height: 0.85rem;
            white-space: nowrap;
        }

        .match-box {
            background: rgba(255,255,255,0.9); border-radius: 15px;
            padding: 12px 15px; border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; gap: 4px;
            text-align: center;
        }
        .nm-header { font-size: 0.7rem; font-weight: 900; color: #43a047; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
        .nm-date   { font-size: 0.9rem; font-weight: 900; color: var(--text-main); margin-top: 2px; white-space: nowrap; }
        .nm-teams  { font-size: 0.82rem; font-weight: 700; color: var(--text-sub); display: flex; align-items: center; justify-content: center; gap: 4px; margin: 4px 0; flex-wrap: nowrap; white-space: nowrap; }
        .nm-rank   { font-size: 0.58rem; color: #a1887f; background: #f0f0f0; padding: 1px 4px; border-radius: 4px; margin-left: 2px; font-weight: 700; display: inline-flex; align-items: center; gap: 1px; min-width: 2.2em; justify-content: center; white-space: nowrap; }
        .nm-rank-live { color: #2575fc; background: #eef5ff; }
        .nm-rank-cache { color: #8d6e63; background: #f5f1ee; }
        .nm-rank-loading:after { content: '...'; animation: rankDots 1.5s infinite; }
        @keyframes rankDots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } }
        .nm-venue  { font-size: 0.7rem; color: #a1887f; font-weight: 700; margin-top: 2px; border-top: 1px dashed rgba(0,0,0,0.05); padding-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 390px) {
            .phone-canvas { padding-left: 8px; padding-right: 8px; }
            .glass-card { padding: 11px; }
            .weekly-grid { gap: 1px; }
            .w-item { font-size: 0.6rem; }
            .w-date { font-size: 0.53rem; }
            .w-wind { font-size: 0.5rem; }
            .nm-teams { font-size: 0.78rem; }
        }
    </style>
</head>

        { text: "素早く動き、常に学び続けなさい。", author: "Jeff Bezos" },
        { text: "発明には、長い間誤解される覚悟が必要だ。", author: "Jeff Bezos" }
    ];

    function renderQuote() {
        const lastIndex = Number(localStorage.getItem('last_quote_index') || '-1');
        let index = Math.floor(Math.random() * QUOTES.length);
        if (QUOTES.length > 1) {
            while (index === lastIndex) {
                index = Math.floor(Math.random() * QUOTES.length);
            }
        }
        localStorage.setItem('last_quote_index', String(index));
        const q = QUOTES[index];
        document.getElementById('q-text').textContent = `「${q.text}」`;
        document.getElementById('q-author').textContent = `― ${q.author}`;
    }

    function renderNextMatch() {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const match = JOETSU.schedule.find(m => new Date(m.date) >= today);
        const el = document.getElementById('next-match');
        if (!match) { el.innerHTML = `<div style="font-size:0.7rem;color:#aaa;text-align:center">今季の全試合が終了しました。</div>`; return; }
        el.innerHTML = `<div class="nm-header">⚽ 第${match.round}節</div><div class="nm-date">${match.label} ${match.time} Kick Off</div><div class="nm-teams"><span>${match.home}<span class="nm-rank nm-rank-loading" id="home-rank" data-team="${match.home}" data-fallback-rank="${match.homeRank}">取得中</span></span><span style="color:#ccc;font-size:0.65rem;font-weight:900;margin:0 4px">vs</span><span>${match.away}<span class="nm-rank nm-rank-loading" id="away-rank" data-team="${match.away}" data-fallback-rank="${match.awayRank}">取得中</span></span></div><div class="nm-venue">📍 ${match.venue}</div>`;
        updateMatchRanks(match);
    }

    async function updateMatchRanks(match) {
        const targetUrl = 'https://koko-soccer.com/score/4345';
        const cacheKey = 'joetsu_soccer_standings_cache_v3';
        const cacheMaxAge = 1000 * 60 * 60 * 6;

        function normalizeTeamName(name) {
            return String(name || '').replace(/\s+/g, '').replace(/高校/g, '').replace(/サッカー部/g, '').replace(/ＦＣ/g, 'FC').replace(/Ｕ/g, 'U').replace(/１８/g, '18').replace(/２ｎｄ/gi, '2nd').replace(/セカンド/g, '2nd');
        }

        function teamAliases(name) {
            const normalized = normalizeTeamName(name);
            const aliases = {
                "上越": ["上越", "上越高", "上越高校"],
                "松本国際": ["松本国際", "松本国際高", "松本国際高校"],
                "富山第一": ["富山第一", "富山第一高", "富山第一高校"],
                "帝京長岡2nd": ["帝京長岡2nd", "帝京長岡２nd", "帝京長岡2", "帝京長岡"],
                "富山U18": ["富山U18", "カターレ富山U18", "富山Ｕ１８", "富山"],
                "星稜": ["星稜", "星稜高", "星稜高校"],
                "新潟U18": ["新潟U18", "アルビレックス新潟U18", "新潟Ｕ１８", "新潟"]
            };
            return aliases[normalized] || [normalized];
        }

        function renderRank(elId, rankNum, pointsStr, mode) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.classList.remove('nm-rank-loading', 'nm-rank-live', 'nm-rank-cache');
            if (mode === 'live') el.classList.add('nm-rank-live');
            if (mode === 'cache') el.classList.add('nm-rank-cache');
            el.textContent = `${rankNum}位`;
            el.title = pointsStr && pointsStr !== '--' ? `勝点 ${pointsStr}` : '';
        }

        function renderFallbackRanks() {
            renderRank('home-rank', match.homeRank, '--', 'fallback');
            renderRank('away-rank', match.awayRank, '--', 'fallback');
        }

        function renderRanksFromStandings(standings, mode) {
            const home = findTeamStanding(standings, match.home);
            const away = findTeamStanding(standings, match.away);
            if (home) renderRank('home-rank', home.rankNum, home.pointsStr, mode);
            if (away) renderRank('away-rank', away.rankNum, away.pointsStr, mode);
        }

        function saveCache(standings) {
            localStorage.setItem(cacheKey, JSON.stringify({ standings, savedAt: Date.now() }));
        }

        function readCache() {
            try {
                const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
                if (!cached || !cached.standings || !cached.savedAt) return null;
                if (Date.now() - cached.savedAt > cacheMaxAge) return cached;
                return cached;
            } catch(e) {
                return null;
            }
        }

        function timeoutPromise(ms) {
            return new Promise((_, reject) => { setTimeout(() => reject(new Error('Timeout')), ms); });
        }

        async function fetchWithTimeout(url, ms) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                if (!res.ok) throw new Error('Fetch failed: ' + res.status);
                return await res.text();
            } finally {
                clearTimeout(timer);
            }
        }

        function extractHtml(proxyName, text) {
            if (proxyName === 'allorigins') {
                const data = JSON.parse(text);
                return data.contents || '';
            }
            return text;
        }

        function pickRankNumber(cells, rowText) {
            const rankCandidates = [];
            cells.forEach((cell, index) => {
                const compact = String(cell || '').replace(/\s+/g, '');
                const exactRank = compact.match(/^(\d{1,2})位?$/);
                const withRankChar = compact.match(/(^|[^0-9])(\d{1,2})位($|[^0-9])/);
                if (exactRank) {
                    const n = Number(exactRank[1]);
                    if (n >= 1 && n <= 20) rankCandidates.push({ value: String(n), score: index === 0 ? 1 : 2 });
                }
                if (withRankChar) {
                    const n = Number(withRankChar[2]);
                    if (n >= 1 && n <= 20) rankCandidates.push({ value: String(n), score: index === 0 ? 1 : 3 });
                }
            });

            const rowRankMatches = String(rowText || '').matchAll(/(^|[^0-9])(\d{1,2})位($|[^0-9])/g);
            for (const m of rowRankMatches) {
                const n = Number(m[2]);
                if (n >= 1 && n <= 20) rankCandidates.push({ value: String(n), score: 4 });
            }

            rankCandidates.sort((a, b) => a.score - b.score);
            return rankCandidates.length ? rankCandidates[0].value : '';
        }

        function pickPointsNumber(cells, rankNum) {
            const nums = cells.map(v => {
                const compact = String(v || '').replace(/\s+/g, '');
                const exact = compact.match(/^\d{1,3}$/);
                return exact ? exact[0] : '';
            }).filter(Boolean).filter(v => v !== rankNum).filter(v => Number(v) < 200);
            if (nums.length >= 2) return nums[1];
            if (nums.length >= 1) return nums[0];
            return '--';
        }

        function parseStandings(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const rows = Array.from(doc.querySelectorAll('tr'));
            const standings = {};

            rows.forEach(row => {
                const cells = Array.from(row.querySelectorAll('th,td')).map(td => td.textContent.trim()).filter(Boolean);
                const rowText = row.textContent.replace(/\s+/g, ' ').trim();
                const rowCompact = normalizeTeamName(row.textContent);
                if (cells.length < 2) return;

                const knownTeams = ["上越", "松本国際", "富山第一", "帝京長岡2nd", "富山U18", "星稜", "新潟U18"];
                const matchedTeam = knownTeams.find(team => teamAliases(team).some(alias => rowCompact.includes(normalizeTeamName(alias))));
                if (!matchedTeam) return;

                const rankNum = pickRankNumber(cells, rowText);
                if (!rankNum) return;

                const pointsNum = pickPointsNumber(cells, rankNum);
                standings[normalizeTeamName(matchedTeam)] = { team: matchedTeam, rankNum, pointsStr: pointsNum || '--' };
            });

            if (!standings[normalizeTeamName('上越')]) throw new Error('Joetsu standing not found');
            return standings;
        }

        function findTeamStanding(standings, teamName) {
            const aliases = teamAliases(teamName);
            for (const alias of aliases) {
                const key = normalizeTeamName(alias);
                if (standings[key]) return standings[key];
            }
            const keys = Object.keys(standings);
            const matchedKey = keys.find(key => aliases.some(alias => key.includes(normalizeTeamName(alias)) || normalizeTeamName(alias).includes(key)));
            return matchedKey ? standings[matchedKey] : null;
        }

        async function fetchStandingsByProxy(proxy) {
            const raw = await fetchWithTimeout(proxy.url, proxy.timeout);
            const html = extractHtml(proxy.name, raw);
            return parseStandings(html);
        }

        renderFallbackRanks();

        const cached = readCache();
        if (cached && cached.standings) renderRanksFromStandings(cached.standings, 'cache');

        const proxies = [
            { name: 'allorigins', url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&_=${Date.now()}`, timeout: 2600 },
            { name: 'corsproxy', url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}&_=${Date.now()}`, timeout: 2600 },
            { name: 'codetabs', url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}&_=${Date.now()}`, timeout: 2600 }
        ];

        try {
            const standings = await Promise.race([Promise.any(proxies.map(fetchStandingsByProxy)), timeoutPromise(3200)]);
            renderRanksFromStandings(standings, 'live');
            saveCache(standings);
        } catch (err) {
            console.warn("Soccer standings fetch failed:", err);
            if (!cached) renderFallbackRanks();
            setTimeout(() => updateMatchRanks(match), 10000);
        }
    }

    function updateClock() {
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        document.getElementById('date').innerText = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 (' + days[now.getDay()] + ')';
        document.getElementById('time').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    const weatherIcons = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",61:"🌧️",63:"🌧️",65:"🌧️",80:"🌦️",81:"🌧️",82:"🌧️",95:"⚡"};

    async function updateWeatherLocationName(lat, lon, isFallback) {
        const locationEl = document.getElementById('weather-location');
        const cacheKey = `weather_location_name_${lat.toFixed(3)}_${lon.toFixed(3)}`;
        const cachedName = localStorage.getItem(cacheKey);

        if (cachedName) {
            locationEl.innerText = isFallback ? `📍 代替地点の天気：${cachedName}` : `📍 現在地の天気：${cachedName}`;
            return;
        }

        locationEl.innerText = isFallback ? `📍 代替地点の天気：地名確認中...` : `📍 現在地の天気：地名確認中...`;

        try {
            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`);
            if (!res.ok) throw new Error('Location fetch failed');
            const data = await res.json();

            const parts = [
                data.principalSubdivision,
                data.city,
                data.locality
            ].filter(Boolean);

            const uniqueParts = [...new Set(parts)];
            const placeName = uniqueParts.length ? uniqueParts.join(' ') : data.countryName || '地名取得不可';

            localStorage.setItem(cacheKey, placeName);
            locationEl.innerText = isFallback ? `📍 代替地点の天気：${placeName}` : `📍 現在地の天気：${placeName}`;
        } catch (e) {
            console.error(e);
            locationEl.innerText = isFallback ? `📍 代替地点の天気：地名取得不可` : `📍 現在地の天気：地名取得不可`;
        }
    }

    async function fetchWeather(pos, isFallback) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        updateWeatherLocationName(lat, lon, isFallback);

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,sunrise,sunset&timezone=Asia%2FTokyo&wind_speed_unit=ms`;
        try {
            const res = await fetch(url);
            renderData(await res.json());
        } catch (e) { console.error(e); }
    }

    function renderData(data) {
        const now = new Date(), hr = now.getHours(), todayStr = now.toLocaleDateString('sv');
        const tmrMax = Math.round(data.daily.temperature_2m_max[1]), tmrMin = Math.round(data.daily.temperature_2m_min[1]);
        const isRainy = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95].includes(data.daily.weather_code[1]);
        const advice = isRainy ? "🧺部屋干し推奨" : "☀️外干しOK";

        document.getElementById('tomorrow-box').innerHTML = `
            <span>明日</span>
            <span>${advice}</span>
            <span style="color:red">${tmrMax}</span><span style="color:#555">/</span><span style="color:blue">${tmrMin}</span>℃
        `;

        const hBox = document.getElementById('hourly-list'); hBox.innerHTML = '';
        data.hourly.time.forEach((t, i) => {
            const h = parseInt(t.split('T')[1]);
            if(t.includes(todayStr) && h >= hr) {
                const prob = data.hourly.precipitation_probability[i];
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const wind = Math.round(data.hourly.wind_speed_10m[i]);
                hBox.innerHTML += `<div class="hourly-item"><div class="h-time">${h}時</div><div class="h-icon">${weatherIcons[data.hourly.weather_code[i]]}</div><div class="h-prob">${prob}%</div><div class="h-temp">${temp}℃</div><div class="h-wind">${wind}m/s</div></div>`;
            }
        });

        const wBox = document.getElementById('weekly-list'); wBox.innerHTML = '';
        const days = ['日','月','火','水','木','金','土'];
        for(let i=0; i<7; i++) {
            const d = new Date(data.daily.time[i]);
            const wind = Math.round(data.daily.wind_speed_10m_max[i]);
            wBox.innerHTML += `<div class="w-item"><div class="w-date">${d.getDate()}(${days[d.getDay()]})</div><span class="w-icon">${weatherIcons[data.daily.weather_code[i]]}</span><div class="w-max">${Math.round(data.daily.temperature_2m_max[i])}</div><div class="w-min">${Math.round(data.daily.temperature_2m_min[i])}</div><div class="w-wind">${wind}m/s</div></div>`;
        }
        document.getElementById('sun-times-inline').innerText = `🌅${data.daily.sunrise[0].split('T')[1]} 🌇${data.daily.sunset[0].split('T')[1]}`;
    }

    function renderPikmin() {
        const now = new Date(), key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const d = PIKMIN_MONTHLY[key], content = document.getElementById('pikmin-content');
        if(!d) return;
        document.getElementById('pikmin-title').textContent = `🌿 ${d.eventName}`;
        content.innerHTML = d.cards.map(c => `<div class="p-card"><div class="p-label">${c.label}</div><img src="${c.url}"></div>`).join('');
    }

    updateClock(); setInterval(updateClock, 60000);
    renderPikmin(); renderQuote(); renderNextMatch();
    navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos, false),
        () => fetchWeather({coords:{latitude:35.5,longitude:140.1}}, true),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 600000 }
    );
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikmin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #fff9c4 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-main: #4e342e;
            --text-sub: #795548;
            --ok: #28cd41;
            --warn: #ff9500;
            --ng: #ff3b30;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #333;
            display: flex; justify-content: center;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .phone-canvas {
            width: 100%; max-width: 430px; min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; flex-direction: column; gap: 10px;
            padding: 10px 12px 60px;
            box-sizing: border-box;
        }

        /* ── 時計 ── */
        #datetime-section { text-align: center; margin: 5px 0; }
        #date { font-size: 1rem; font-weight: 700; color: var(--text-sub); }
        #time { font-size: 3.5rem; font-weight: 900; margin: -5px 0; letter-spacing: 1px; }

        /* ── 名言 ── */
        #quote-section {
            text-align: center; padding: 5px 10px 15px;
            min-height: 3.2em; display: flex; flex-direction: column; justify-content: center;
        }
        .q-text { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); line-height: 1.5; }
        .q-author { font-size: 0.65rem; color: #a1887f; margin-top: 4px; font-weight: 700; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 2px solid var(--glass-border);
            border-radius: 20px; padding: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .section-title { font-size: 0.8rem; font-weight: 900; color: var(--text-sub); margin-bottom: 10px; display: block; }

        /* ── 日没までの空もよう ── */
        .hourly-section-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
        }
        .sun-times-inline { font-size: 0.65rem; font-weight: 700; color: var(--text-sub); }
        .hourly-scroll { display: flex; overflow-x: auto; gap: 14px; padding: 2px 0 8px; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hourly-item { display: flex; flex-direction: column; align-items: center; min-width: 44px; gap: 2px; }
        .h-time { font-size: 0.7rem; font-weight: 700; color: var(--text-sub); }
        .h-icon { font-size: 1.4rem; }
        .h-prob { font-size: 0.65rem; color: #03a9f4; font-weight: 900; }
        .h-walk { font-size: 0.75rem; font-weight: 900; margin-top: 2px; }

        /* ── 明日の天気（1行） ── */
        .tomorrow-inline {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 8px; padding: 8px 12px; background: rgba(255,255,255,0.85);
            border-radius: 12px; font-size: 0.75rem; font-weight: 700;
            color: var(--text-sub); border: 1px solid rgba(0,0,0,0.03);
        }

        /* ── ピクミン ── */
        .p-container { display: flex; flex-direction: column; gap: 8px; }
        .p-card { background: white; border-radius: 15px; overflow: hidden; border: 2px solid var(--glass-border); }
        .p-label { padding: 6px; font-size: 0.75rem; font-weight: 900; text-align: center; background: #fff; }
        .p-card img { width: 100%; height: auto; display: block; }
        .p-no-data { text-align: center; padding: 20px; color: #aaa; font-size: 0.75rem; }

        /* ── 週間予報 ── */
        .weekly-grid { display: flex; justify-content: space-between; gap: 4px; }
        .w-item { flex: 1; text-align: center; font-size: 0.7rem; font-weight: 700; }
        .w-icon { font-size: 1.3rem; margin: 3px 0; display: block; }

        /* ── サッカー次節ボックス (iPhone 16e向け調整) ── */
        .match-box {
            background: rgba(255,255,255,0.9); border-radius: 15px;
            padding: 12px 15px; border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; gap: 4px;
        }
        .nm-header { font-size: 0.7rem; font-weight: 900; color: #43a047; display: flex; align-items: center; gap: 5px; }
        .nm-date   { font-size: 0.9rem; font-weight: 900; color: var(--text-main); margin-top: 2px; }
        .nm-teams  { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin: 2px 0; }
        .nm-vs     { font-size: 0.7rem; color: #ccc; font-weight: 900; }
        .nm-venue  { font-size: 0.7rem; color: #a1887f; font-weight: 700; margin-top: 2px; border-top: 1px dashed rgba(0,0,0,0.05); padding-top: 4px; }

        .dot { height: 6px; width: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .bg-ok   { background-color: var(--ok); }
        .bg-warn { background-color: var(--warn); }
        .bg-ng   { background-color: var(--ng); }
    </style>
</head>
<body>

<div class="phone-canvas">
    <header id="datetime-section">
        <div id="date">--月--日 (--)</div>
        <div id="time">00:00</div>
    </header>

    <div id="quote-section">
        <div class="q-text" id="q-text">Stay hungry, Stay foolish.</div>
        <div class="q-author" id="q-author">― Steve Jobs</div>
    </div>

    <section class="glass-card">
        <div class="hourly-section-header">
            <span class="section-title">☁️ 日没までの空もよう</span>
            <div id="sun-times-inline" class="sun-times-inline"></div>
        </div>
        <div id="hourly-list" class="hourly-scroll"></div>
        <div id="tomorrow-box" class="tomorrow-inline">明日情報読み込み中...</div>
    </section>

    <section class="glass-card">
        <span class="section-title" id="pikmin-title">🌿 ピクミンブルーム 最新情報</span>
        <div id="pikmin-content" class="p-container"></div>
    </section>

    <section class="glass-card">
        <span class="section-title">📅 週間予報</span>
        <div id="weekly-list" class="weekly-grid"></div>
    </section>

    <section class="glass-card">
        <span class="section-title">⚽ サッカー次節案内</span>
        <div class="match-box" id="next-match"></div>
    </section>
</div>

<script>
    const PIKMIN_MONTHLY = {
        "2026-04": {
            eventName: "4月のピクミン情報",
            cards: [
                { label: "今月のお題",  url: "https://lh3.googleusercontent.com/aOe_CqCJdFevS2otcFy913LHXkdbCpGQ4idw-DZqD6qYClbXBxMydcbSm5NhADdjoUnRu9Hg0hsm3RUgprGpSm6mss9BlI6_16k=e365-pa-nu-w1700" },
                { label: "ボーナス報酬", url: "https://lh3.googleusercontent.com/jaz1ERppQaebuacrS6xyumT_WFuO2fpw20XqgzAlMyxMj5mB6nerpzA3C7nh2xKtZTRGztpar05amhvcMod2RzRVKUUoYGy1UQ=e365-pa-nu-w1700" }
            ]
        }
    };

    const JOETSU = {
        name: "上越",
        rank: 8,
        schedule: [
            { round: 5,  date: "2026-05-03", label: "5/3(土)",  time: "14:00", opponent: "松本国際",    oppRank: 1,  venue: "松本市サッカー場" },
            { round: 6,  date: "2026-05-10", label: "5/10(土)", time: "10:30", opponent: "富山第一",    oppRank: 6,  venue: "新井総合公園" },
            { round: 7,  date: "2026-05-16", label: "5/16(土)", time: "11:00", opponent: "帝京長岡2nd", oppRank: 9,  venue: "帝京長岡" },
            { round: 8,  date: "2026-05-23", label: "5/23(土)", time: "10:30", opponent: "富山U18",      oppRank: 10, venue: "新井総合公園" },
            { round: 9,  date: "2026-06-13", label: "6/13(土)", time: "10:30", opponent: "星稜",          oppRank: 4,  venue: "新井総合公園" },
            { round: 10, date: "2026-06-27", label: "6/27(土)", time: "10:30", opponent: "新潟U18",      oppRank: 3,  venue: "新井総合公園" },
        ]
    };

    const QUOTES = [
        { text: "ハングリーであれ。愚かであれ。", author: "Steve Jobs" },
        { text: "あなたの時間は限られている。他人の人生を生きて無駄にしてはいけない。", author: "Steve Jobs" },
        { text: "イノベーションは、誰をリーダーにし、誰をフォロワーにするかを決定づける。", author: "Steve Jobs" },
        { text: "墓場で一番の金持ちになることに意味はない。夜寝る時、素晴らしい事をしたと言えることが重要だ。", author: "Steve Jobs" },
        { text: "もし今日が人生最後の日だとしたら、私は今日することをしたいと思うだろうか？", author: "Steve Jobs" },
        { text: "美しい家具を作る職人は、誰も見ないからといって、タンスの裏側に安物の合板を使ったりはしない。", author: "Steve Jobs" },
        { text: "前を向いて点をつなぐことはできない。後ろを振り返ってつなぐことしかできない。", author: "Steve Jobs" },
        { text: "量より質が重要だ。2つの二塁打より、1つの本塁打の方がずっといい。", author: "Steve Jobs" },
        { text: "自分もいつかは死ぬと考えることは、失うものがあるという思考の罠を避ける最良の方法だ。", author: "Steve Jobs" },
        { text: "独創的である必要はない。ただ、圧倒的に優れていればいい。", author: "Steve Jobs" },
        { text: "終着点は重要じゃない。旅の途中でどれだけ楽しい思いができるかが大事なんだ。", author: "Steve Jobs" },
        { text: "何をしないかを決めることは、何をするかを決めるのと同じくらい大事だ。", author: "Steve Jobs" },
        { text: "顧客は、形にして見せてもらうまで、自分が何が欲しいか分からないものだ。", author: "Steve Jobs" },
        { text: "地局の重要性を理解している人間は、細部を疎かにはしない。", author: "Steve Jobs" },
        { text: "成功と失敗の一番の違いは、途中で諦めるか諦めないかだ。", author: "Steve Jobs" },
        { text: "直感は知性よりも強力だ。", author: "Steve Jobs" },
        { text: "シンプルであることは、複雑であることよりも難しい。", author: "Steve Jobs" },
        { text: "私たちがしていることのほとんどは、誰か他の人が作ったものの上に成り立っている。", author: "Steve Jobs" },
        { text: "宇宙に衝撃を与えよう。", author: "Steve Jobs" },
        { text: "一つのことを成し遂げるには、それ以外の100の素晴らしいアイデアに「NO」と言う必要がある。", author: "Steve Jobs" },
    ];
    while(QUOTES.length < 100) { QUOTES.push(QUOTES[Math.floor(Math.random()*20)]); }

    function renderQuote() {
        const orderKey = 'pik_qorder_jobs', idxKey = 'pik_qidx_jobs';
        let order = JSON.parse(localStorage.getItem(orderKey) || 'null');
        let idx   = parseInt(localStorage.getItem(idxKey) || '0');
        if (!order || idx >= order.length) {
            order = Array.from({ length: QUOTES.length }, (_, i) => i).sort(() => Math.random() - 0.5);
            idx = 0;
            localStorage.setItem(orderKey, JSON.stringify(order));
        }
        const q = QUOTES[order[idx]];
        localStorage.setItem(idxKey, String(idx + 1));
        document.getElementById('q-text').textContent   = `「${q.text}」`;
        document.getElementById('q-author').textContent = q.author ? `― ${q.author}` : '';
    }

    function renderNextMatch() {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const match = JOETSU.schedule.find(m => new Date(m.date) >= today);
        const el = document.getElementById('next-match');
        if (!match) {
            el.innerHTML = `<div style="font-size:0.7rem;color:#aaa;text-align:center">今季の全試合が終了しました。</div>`;
            return;
        }
        el.innerHTML = `
            <div class="nm-header">⚽ 第${match.round}節</div>
            <div class="nm-date">${match.label} ${match.time || ''} Kick Off</div>
            <div class="nm-teams">
                <span>${JOETSU.name}</span>
                <span class="nm-vs">vs</span>
                <span>${match.opponent}</span>
            </div>
            <div class="nm-venue">📍 ${match.venue}</div>
        `;
    }

    function updateClock() {
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        document.getElementById('date').innerText = (now.getMonth() + 1) + '月' + now.getDate() + '日 (' + days[now.getDay()] + ')';
        document.getElementById('time').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    const weatherIcons = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",61:"🌧️",63:"🌧️",65:"🌧️",80:"🌦️",81:"🌧️",82:"🌧️",95:"⚡"};

    async function fetchWeather(pos) {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,windspeed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Asia%2FTokyo&models=best_match`);
            const data = await res.json();
            renderData(data);
        } catch (e) { console.error(e); }
    }

    function renderData(data) {
        const now = new Date(); const hr = now.getHours(); const todayStr = now.toLocaleDateString('sv');

        // 明日の1行表示
        const tmrMax = Math.round(data.daily.temperature_2m_max[1]), tmrMin = Math.round(data.daily.temperature_2m_min[1]);
        const tmrIcon = weatherIcons[data.daily.weather_code[1]];
        document.getElementById('tomorrow-box').innerHTML = `
            <span>明日 ${tmrIcon}</span>
            <span style="color:var(--ng)">${tmrMax}</span>/<span style="color:#03a9f4">${tmrMin}</span>
            <span>💨${(data.hourly.windspeed_10m[24+10]/3.6).toFixed(1)}m</span>
            <span>🚲${tmrMax>15?'◎':'○'}</span><span>🧺${data.daily.weather_code[1]<3?'◎':'△'}</span>
        `;

        // 24h & 散歩判定
        const sunsetH = parseInt(data.daily.sunset[0].split('T')[1]);
        const hBox = document.getElementById('hourly-list'); hBox.innerHTML = '';
        data.hourly.time.forEach((t, i) => {
            const h = parseInt(t.split('T')[1]);
            if(t.includes(todayStr) && h >= hr && h <= sunsetH) {
                const prob = data.hourly.precipitation_probability[i];
                // 散歩判定：20%以下◎, 40%以下△, それ以上✕
                const walkIcon = prob <= 20 ? '<span style="color:var(--ok)">🐾◎</span>' : prob <= 40 ? '<span style="color:var(--warn)">🐾△</span>' : '<span style="color:var(--ng)">🐾✕</span>';
                
                hBox.innerHTML += `
                    <div class="hourly-item">
                        <div class="h-time">${h}時</div>
                        <div class="h-icon">${weatherIcons[data.hourly.weather_code[i]]}</div>
                        <div class="h-prob">${prob}%</div>
                        <div class="h-walk">${walkIcon}</div>
                    </div>`;
            }
        });

        // 週間
        const wBox = document.getElementById('weekly-list'); wBox.innerHTML = '';
        const days = ['日','月','火','水','木','金','土'];
        for(let i=0; i<7; i++) {
            const d = new Date(data.daily.time[i]);
            wBox.innerHTML += `<div class="w-item"><div>${i==0?'今':days[d.getDay()]}</div><span class="w-icon">${weatherIcons[data.daily.weather_code[i]]}</span><div style="color:var(--ng)">${Math.round(data.daily.temperature_2m_max[i])}</div><div style="color:#03a9f4">${Math.round(data.daily.temperature_2m_min[i])}</div></div>`;
        }
        document.getElementById('sun-times-inline').innerText = `🌅${data.daily.sunrise[0].split('T')[1]} 🌇${data.daily.sunset[0].split('T')[1]}`;
    }

    function renderPikmin() {
        const now = new Date(); const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const d = PIKMIN_MONTHLY[key]; const content = document.getElementById('pikmin-content');
        if(!d) { content.innerHTML = '<div class="p-no-data">Pikmin Data Empty</div>'; return; }
        document.getElementById('pikmin-title').textContent = `🌿 ${d.eventName}`;
        content.innerHTML = d.cards.map(c => `<div class="p-card"><div class="p-label">${c.label}</div><img src="${c.url}" onerror="this.style.display='none'"></div>`).join('');
    }

    updateClock(); setInterval(updateClock, 60000);
    renderPikmin(); renderQuote(); renderNextMatch();
    navigator.geolocation.getCurrentPosition(fetchWeather, () => fetchWeather({coords:{latitude:35.5,longitude:140.1}}));
</script>
</body>
</html>

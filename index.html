<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikmin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #fff9c4 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-main: #4e342e;
            --text-sub: #795548;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #333;
            display: flex; justify-content: center;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .phone-canvas {
            width: 100%; max-width: 430px; min-height: 100vh;
            background: var(--bg-gradient);
            display: flex; flex-direction: column; gap: 10px;
            padding: 10px 12px 60px;
            box-sizing: border-box;
        }

        #datetime-section { text-align: center; margin: 5px 0; }
        #date { font-size: 1rem; font-weight: 700; color: var(--text-sub); }
        #time { font-size: 3.5rem; font-weight: 900; margin: -5px 0; letter-spacing: 1px; }

        #quote-section {
            text-align: center; padding: 5px 10px 15px;
            min-height: 4.2em; display: flex; flex-direction: column; justify-content: center;
        }
        .q-text { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); line-height: 1.5; padding: 0 10px; }
        .q-author { font-size: 0.65rem; color: #a1887f; margin-top: 4px; font-weight: 700; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 2px solid var(--glass-border);
            border-radius: 20px; padding: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .section-title { font-size: 0.8rem; font-weight: 900; color: var(--text-sub); margin: 0; display: flex; align-items: center; height: 1.5rem; }

        .hourly-section-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; height: 1.5rem;
        }
        .sun-times-container { display: flex; align-items: center; gap: 8px; height: 100%; }
        .sun-times-inline { font-size: 0.65rem; font-weight: 700; color: var(--text-sub); line-height: 1.5rem; }
        
        .hourly-scroll { display: flex; overflow-x: auto; gap: 14px; padding: 2px 0 8px; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hourly-item { 
            display: flex; flex-direction: column; align-items: center; 
            min-width: 46px; gap: 4px; 
        }
        .h-time { font-size: 0.7rem; font-weight: 700; color: var(--text-sub); }
        .h-icon { font-size: 1.4rem; height: 1.6rem; display: flex; align-items: center; margin: 2px 0; }
        .h-prob { font-size: 0.65rem; color: #03a9f4; font-weight: 900; margin-bottom: 0; }
        .h-temp { font-size: 0.65rem; color: #f44336; font-weight: 900; line-height: 1; }
        .h-wind { font-size: 0.6rem; color: #607d8b; font-weight: 900; line-height: 1; }

        .tomorrow-row {
            margin-top: 8px; padding: 8px 12px; background: rgba(255,255,255,0.85);
            border-radius: 12px; border: 1px solid rgba(0,0,0,0.03);
            font-size: 0.75rem; font-weight: 900; color: var(--text-sub);
            display: flex; align-items: center; justify-content: space-between;
        }

        .p-container { display: flex; flex-direction: column; gap: 8px; }
        .p-card { background: white; border-radius: 15px; overflow: hidden; border: 2px solid var(--glass-border); }
        .p-label { padding: 6px; font-size: 0.75rem; font-weight: 900; text-align: center; background: #fff; }
        .p-card img { width: 100%; height: auto; display: block; }

        .weekly-grid { display: flex; justify-content: space-between; gap: 4px; }
        .w-item { flex: 1; text-align: center; font-size: 0.65rem; font-weight: 700; }
        .w-date { font-size: 0.6rem; color: var(--text-sub); margin-bottom: 2px; }
        .w-icon { font-size: 1.3rem; margin: 3px 0; display: block; min-height: 1.5rem; }
        .w-wind { color: #607d8b; font-size: 0.58rem; font-weight: 900; margin-top: 2px; }

        .match-box {
            background: rgba(255,255,255,0.9); border-radius: 15px;
            padding: 12px 15px; border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; gap: 4px;
            text-align: center;
        }
        .nm-header { font-size: 0.7rem; font-weight: 900; color: #43a047; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .nm-date   { font-size: 0.9rem; font-weight: 900; color: var(--text-main); margin-top: 2px; }
        .nm-teams  { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); display: flex; align-items: center; justify-content: center; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
        .nm-rank   { font-size: 0.6rem; color: #a1887f; background: #f0f0f0; padding: 1px 4px; border-radius: 4px; margin-left: 2px; font-weight: 700; display: inline-flex; align-items: center; gap: 1px; min-width: 2.2em; justify-content: center; }
        .nm-rank-live { color: #2575fc; background: #eef5ff; }
        .nm-rank-cache { color: #8d6e63; background: #f5f1ee; }
        .nm-rank-loading:after { content: '...'; animation: rankDots 1.5s infinite; }
        @keyframes rankDots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } }
        .nm-venue  { font-size: 0.7rem; color: #a1887f; font-weight: 700; margin-top: 2px; border-top: 1px dashed rgba(0,0,0,0.05); padding-top: 4px; }
    </style>
</head>
<body>

<div class="phone-canvas">
    <header id="datetime-section">
        <div id="date">--月--日 (--)</div>
        <div id="time">00:00</div>
    </header>

    <div id="quote-section">
        <div class="q-text" id="q-text">読み込み中...</div>
        <div class="q-author" id="q-author"></div>
    </div>

    <section class="glass-card">
        <div class="hourly-section-header">
            <span class="section-title">☁️ 日没までの空もよう</span>
            <div class="sun-times-container">
                <div id="sun-times-inline" class="sun-times-inline"></div>
            </div>
        </div>
        <div id="hourly-list" class="hourly-scroll"></div>
        <div id="tomorrow-box" class="tomorrow-row">明日情報読み込み中...</div>
    </section>

    <section class="glass-card">
        <span class="section-title" id="pikmin-title">🌿 ピクミンブルーム 最新情報</span>
        <div id="pikmin-content" class="p-container"></div>
    </section>

    <section class="glass-card">
        <span class="section-title">📅 週間予報</span>
        <div id="weekly-list" class="weekly-grid"></div>
    </section>

    <section class="glass-card">
        <span class="section-title">⚽ サッカー次節案内</span>
        <div class="match-box" id="next-match"></div>
    </section>
</div>

<script>
    const PIKMIN_MONTHLY = {
        "2026-05": {
            eventName: "5月のピクミン情報",
            cards: [
                { label: "今月のお題", url: "https://lh3.googleusercontent.com/afHeTXZAZ0spg_McMmGWEyqVzgvsAVU2Xx5eCn6K1p1fvkOAKQuBZEcVM13ClEVcXfRS7EBovmEdE8C-mxLNhqy2IXSOwSTtt8ow=e365-pa-nu-w850" },
                { label: "ボーナス報酬", url: "https://lh3.googleusercontent.com/hJnceMAaxtWGJnBtrntbLOvSCRmSj3-iIPfu3VRRxq-e1Z9vD7rA8E-xuoQTL6xVQNtrV0g8IpaSrUGjMKf6ewc-6M6pBVUPbIg=e365-pa-nu-w850" }
            ]
        }
    };

    const JOETSU = {
        name: "上越", rank: 8, homeVenue: "新井総合公園",
        schedule: [
            { round: 5, date: "2026-05-03", label: "5/3(日)", time: "14:00", home: "松本国際", homeRank: 1, away: "上越", awayRank: 8, venue: "松本市サッカー場" },
            { round: 6, date: "2026-05-10", label: "5/10(日)", time: "10:30", home: "上越", homeRank: 8, away: "富山第一", awayRank: 6, venue: "新井総合公園" },
            { round: 7, date: "2026-05-16", label: "5/16(土)", time: "11:00", home: "帝京長岡2nd", homeRank: 9, away: "上越", awayRank: 8, venue: "帝京長岡" },
            { round: 8, date: "2026-05-23", label: "5/23(土)", time: "10:30", home: "上越", homeRank: 8, away: "富山U18", awayRank: 10, venue: "新井総合公園" },
            { round: 9, date: "2026-06-13", label: "6/13(土)", time: "10:30", home: "上越", homeRank: 8, away: "星稜", awayRank: 4, venue: "新井総合公園" },
            { round: 10, date: "2026-06-27", label: "6/27(土)", time: "10:30", home: "上越", homeRank: 8, away: "新潟U18", awayRank: 3, venue: "新井総合公園" },
        ]
    };

    const QUOTES = [{ text: "ハングリーであれ。愚かであれ。", author: "Steve Jobs" }, { text: "素晴らしい仕事をする唯一の方法は、その仕事を愛することだ。", author: "Steve Jobs" }, { text: "失敗は、より賢明に再挑戦するための機会にすぎない。", author: "Henry Ford" }, { text: "情熱を失わずに失敗を重ね続けられるのが成功だ。", author: "Winston Churchill" }, { text: "行動を伴わないビジョンは、ただの白昼夢. ビジョンのない行動は、ただの悪夢だ。", author: "Japanese Proverb" }];

    function renderQuote() {
        const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
        document.getElementById('q-text').textContent = `「${q.text}」`;
        document.getElementById('q-author').textContent = `― ${q.author}`;
    }

    function renderNextMatch() {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const match = JOETSU.schedule.find(m => new Date(m.date) >= today);
        const el = document.getElementById('next-match');
        if (!match) { el.innerHTML = `<div style="font-size:0.7rem;color:#aaa;text-align:center">今季の全試合が終了しました。</div>`; return; }
        el.innerHTML = `<div class="nm-header">⚽ 第${match.round}節</div><div class="nm-date">${match.label} ${match.time} Kick Off</div><div class="nm-teams"><span>${match.home}<span class="nm-rank nm-rank-loading" id="home-rank" data-team="${match.home}" data-fallback-rank="${match.homeRank}">取得中</span></span><span style="color:#ccc;font-size:0.65rem;font-weight:900;margin:0 4px">vs</span><span>${match.away}<span class="nm-rank nm-rank-loading" id="away-rank" data-team="${match.away}" data-fallback-rank="${match.awayRank}">取得中</span></span></div><div class="nm-venue">📍 ${match.venue}</div>`;
        updateMatchRanks(match);
    }

    /**
     * 【高速版】上越高校と対戦相手の順位取得ロジック
     * - まず予定表に登録済みの順位を即表示
     * - 前回取得済みの順位があればlocalStorageから即更新
     * - 複数プロキシを同時に走らせ、最初に成功したものを採用
     * - 2026など年度の数字を順位として拾わないよう、順位候補を1〜20位に限定
     */
    async function updateMatchRanks(match) {
        const targetUrl = 'https://koko-soccer.com/score/4345';
        const cacheKey = 'joetsu_soccer_standings_cache_v3';
        const cacheMaxAge = 1000 * 60 * 60 * 6;

        function normalizeTeamName(name) {
            return String(name || '')
                .replace(/\s+/g, '')
                .replace(/高校/g, '')
                .replace(/サッカー部/g, '')
                .replace(/ＦＣ/g, 'FC')
                .replace(/Ｕ/g, 'U')
                .replace(/１８/g, '18')
                .replace(/２ｎｄ/gi, '2nd')
                .replace(/セカンド/g, '2nd');
        }

        function teamAliases(name) {
            const normalized = normalizeTeamName(name);
            const aliases = {
                "上越": ["上越", "上越高", "上越高校"],
                "松本国際": ["松本国際", "松本国際高", "松本国際高校"],
                "富山第一": ["富山第一", "富山第一高", "富山第一高校"],
                "帝京長岡2nd": ["帝京長岡2nd", "帝京長岡２nd", "帝京長岡2", "帝京長岡"],
                "富山U18": ["富山U18", "カターレ富山U18", "富山Ｕ１８", "富山"],
                "星稜": ["星稜", "星稜高", "星稜高校"],
                "新潟U18": ["新潟U18", "アルビレックス新潟U18", "新潟Ｕ１８", "新潟"]
            };
            return aliases[normalized] || [normalized];
        }

        function renderRank(elId, rankNum, pointsStr, mode) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.classList.remove('nm-rank-loading', 'nm-rank-live', 'nm-rank-cache');
            if (mode === 'live') el.classList.add('nm-rank-live');
            if (mode === 'cache') el.classList.add('nm-rank-cache');
            if (pointsStr && pointsStr !== '--') {
                el.textContent = `${rankNum}位`;
                el.title = `勝点 ${pointsStr}`;
            } else {
                el.textContent = `${rankNum}位`;
                el.title = '';
            }
        }

        function renderFallbackRanks() {
            renderRank('home-rank', match.homeRank, '--', 'fallback');
            renderRank('away-rank', match.awayRank, '--', 'fallback');
        }

        function renderRanksFromStandings(standings, mode) {
            const home = findTeamStanding(standings, match.home);
            const away = findTeamStanding(standings, match.away);

            if (home) renderRank('home-rank', home.rankNum, home.pointsStr, mode);
            if (away) renderRank('away-rank', away.rankNum, away.pointsStr, mode);
        }

        function saveCache(standings) {
            localStorage.setItem(cacheKey, JSON.stringify({
                standings,
                savedAt: Date.now()
            }));
        }

        function readCache() {
            try {
                const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
                if (!cached || !cached.standings || !cached.savedAt) return null;
                if (Date.now() - cached.savedAt > cacheMaxAge) return cached;
                return cached;
            } catch(e) {
                return null;
            }
        }

        function timeoutPromise(ms) {
            return new Promise((_, reject) => {
                setTimeout(() => reject(new Error('Timeout')), ms);
            });
        }

        async function fetchWithTimeout(url, ms) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            try {
                const res = await fetch(url, {
                    signal: controller.signal,
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error('Fetch failed: ' + res.status);
                return await res.text();
            } finally {
                clearTimeout(timer);
            }
        }

        function extractHtml(proxyName, text) {
            if (proxyName === 'allorigins') {
                const data = JSON.parse(text);
                return data.contents || '';
            }
            return text;
        }

        function pickRankNumber(cells, rowText) {
            const rankCandidates = [];

            cells.forEach((cell, index) => {
                const compact = String(cell || '').replace(/\s+/g, '');
                const exactRank = compact.match(/^(\d{1,2})位?$/);
                const withRankChar = compact.match(/(^|[^0-9])(\d{1,2})位($|[^0-9])/);

                if (exactRank) {
                    const n = Number(exactRank[1]);
                    if (n >= 1 && n <= 20) rankCandidates.push({ value: String(n), score: index === 0 ? 1 : 2 });
                }

                if (withRankChar) {
                    const n = Number(withRankChar[2]);
                    if (n >= 1 && n <= 20) rankCandidates.push({ value: String(n), score: index === 0 ? 1 : 3 });
                }
            });

            const rowRankMatches = String(rowText || '').matchAll(/(^|[^0-9])(\d{1,2})位($|[^0-9])/g);
            for (const m of rowRankMatches) {
                const n = Number(m[2]);
                if (n >= 1 && n <= 20) rankCandidates.push({ value: String(n), score: 4 });
            }

            rankCandidates.sort((a, b) => a.score - b.score);
            return rankCandidates.length ? rankCandidates[0].value : '';
        }

        function pickPointsNumber(cells, rankNum) {
            const nums = cells
                .map(v => {
                    const compact = String(v || '').replace(/\s+/g, '');
                    const exact = compact.match(/^\d{1,3}$/);
                    return exact ? exact[0] : '';
                })
                .filter(Boolean)
                .filter(v => v !== rankNum)
                .filter(v => Number(v) < 200);

            if (nums.length >= 2) return nums[1];
            if (nums.length >= 1) return nums[0];
            return '--';
        }

        function parseStandings(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const rows = Array.from(doc.querySelectorAll('tr'));
            const standings = {};

            rows.forEach(row => {
                const cells = Array.from(row.querySelectorAll('th,td')).map(td => td.textContent.trim()).filter(Boolean);
                const rowText = row.textContent.replace(/\s+/g, ' ').trim();
                const rowCompact = normalizeTeamName(row.textContent);

                if (cells.length < 2) return;

                const knownTeams = ["上越", "松本国際", "富山第一", "帝京長岡2nd", "富山U18", "星稜", "新潟U18"];
                const matchedTeam = knownTeams.find(team => {
                    return teamAliases(team).some(alias => rowCompact.includes(normalizeTeamName(alias)));
                });

                if (!matchedTeam) return;

                const rankNum = pickRankNumber(cells, rowText);
                if (!rankNum) return;

                const pointsNum = pickPointsNumber(cells, rankNum);

                standings[normalizeTeamName(matchedTeam)] = {
                    team: matchedTeam,
                    rankNum,
                    pointsStr: pointsNum || '--'
                };
            });

            if (!standings[normalizeTeamName('上越')]) {
                throw new Error('Joetsu standing not found');
            }

            return standings;
        }

        function findTeamStanding(standings, teamName) {
            const aliases = teamAliases(teamName);
            for (const alias of aliases) {
                const key = normalizeTeamName(alias);
                if (standings[key]) return standings[key];
            }

            const keys = Object.keys(standings);
            const matchedKey = keys.find(key => aliases.some(alias => key.includes(normalizeTeamName(alias)) || normalizeTeamName(alias).includes(key)));
            return matchedKey ? standings[matchedKey] : null;
        }

        async function fetchStandingsByProxy(proxy) {
            const raw = await fetchWithTimeout(proxy.url, proxy.timeout);
            const html = extractHtml(proxy.name, raw);
            return parseStandings(html);
        }

        renderFallbackRanks();

        const cached = readCache();
        if (cached && cached.standings) {
            renderRanksFromStandings(cached.standings, 'cache');
        }

        const proxies = [
            {
                name: 'allorigins',
                url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&_=${Date.now()}`,
                timeout: 2600
            },
            {
                name: 'corsproxy',
                url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}&_=${Date.now()}`,
                timeout: 2600
            },
            {
                name: 'codetabs',
                url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}&_=${Date.now()}`,
                timeout: 2600
            }
        ];

        try {
            const standings = await Promise.race([
                Promise.any(proxies.map(fetchStandingsByProxy)),
                timeoutPromise(3200)
            ]);

            renderRanksFromStandings(standings, 'live');
            saveCache(standings);
        } catch (err) {
            console.warn("Soccer standings fetch failed:", err);

            if (!cached) {
                renderFallbackRanks();
            }

            setTimeout(() => updateMatchRanks(match), 10000);
        }
    }

    function updateClock() {
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        document.getElementById('date').innerText = (now.getMonth() + 1) + '月' + now.getDate() + '日 (' + days[now.getDay()] + ')';
        document.getElementById('time').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    const weatherIcons = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",61:"🌧️",63:"🌧️",65:"🌧️",80:"🌦️",81:"🌧️",82:"🌧️",95:"⚡"};

    async function fetchWeather(pos) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=weather_code&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,sunrise,sunset&timezone=Asia%2FTokyo&wind_speed_unit=ms`;
        try {
            const res = await fetch(url);
            renderData(await res.json());
        } catch (e) { console.error(e); }
    }

    function renderData(data) {
        const now = new Date(), hr = now.getHours(), todayStr = now.toLocaleDateString('sv');
        const tmrMax = Math.round(data.daily.temperature_2m_max[1]), tmrMin = Math.round(data.daily.temperature_2m_min[1]);
        const isRainy = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95].includes(data.daily.weather_code[1]);
        const advice = isRainy ? "🧺部屋干し推奨" : "☀️外干しOK";

        document.getElementById('tomorrow-box').innerHTML = `
            <span>明日</span>
            <span>${advice}</span>
            <span style="color:#555">/</span>
            <span style="color:red">${tmrMax}</span><span style="color:#555">/</span><span style="color:blue">${tmrMin}</span>℃
        `;

        const hBox = document.getElementById('hourly-list'); hBox.innerHTML = '';
        data.hourly.time.forEach((t, i) => {
            const h = parseInt(t.split('T')[1]);
            if(t.includes(todayStr) && h >= hr) {
                const prob = data.hourly.precipitation_probability[i];
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const wind = Math.round(data.hourly.wind_speed_10m[i]);
                hBox.innerHTML += `<div class="hourly-item"><div class="h-time">${h}時</div><div class="h-icon">${weatherIcons[data.hourly.weather_code[i]]}</div><div class="h-prob">${prob}%</div><div class="h-temp">${temp}℃</div><div class="h-wind">${wind}m/s</div></div>`;
            }
        });

        const wBox = document.getElementById('weekly-list'); wBox.innerHTML = '';
        const days = ['日','月','火','水','木','金','土'];
        for(let i=0; i<7; i++) {
            const d = new Date(data.daily.time[i]);
            const wind = Math.round(data.daily.wind_speed_10m_max[i]);
            wBox.innerHTML += `<div class="w-item"><div class="w-date">${d.getDate()}(${days[d.getDay()]})</div><span class="w-icon">${weatherIcons[data.daily.weather_code[i]]}</span><div style="color:red">${Math.round(data.daily.temperature_2m_max[i])}</div><div style="color:blue">${Math.round(data.daily.temperature_2m_min[i])}</div><div class="w-wind">${wind}m/s</div></div>`;
        }
        document.getElementById('sun-times-inline').innerText = `🌅${data.daily.sunrise[0].split('T')[1]} 🌇${data.daily.sunset[0].split('T')[1]}`;
    }

    function renderPikmin() {
        const now = new Date(), key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        const d = PIKMIN_MONTHLY[key], content = document.getElementById('pikmin-content');
        if(!d) return;
        document.getElementById('pikmin-title').textContent = `🌿 ${d.eventName}`;
        content.innerHTML = d.cards.map(c => `<div class="p-card"><div class="p-label">${c.label}</div><img src="${c.url}"></div>`).join('');
    }

    updateClock(); setInterval(updateClock, 60000);
    renderPikmin(); renderQuote(); renderNextMatch();
    navigator.geolocation.getCurrentPosition(fetchWeather, () => fetchWeather({coords:{latitude:35.5,longitude:140.1}}));
</script>
</body>
</html>
